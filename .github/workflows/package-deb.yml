name: Package deb

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3"

jobs:
  build-deb:
    name: Build amd64 .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dpkg
        run: sudo apt-get update && sudo apt-get install -y dpkg

      - name: Build .deb
        run: bun run package:deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoagent-amd64-deb
          path: dist-packages/*.deb
          if-no-files-found: error
