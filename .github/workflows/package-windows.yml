name: Package Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BUN_VERSION: "1.3"

jobs:
  build-windows:
    name: Build win_x64 portable zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build Windows portable zip
        run: bun run package:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanoagent-win-x64-zip
          path: dist-packages/*_win_x64.zip
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packages/*_win_x64.zip
          generate_release_notes: true
