name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "22"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate tag version matches package.json
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate (typecheck + lint + format + test + build)
        run: npm run ci

      - name: Pack
        run: npm pack

      - name: Publish (OIDC trusted publishing; skip if already published)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          PUBLISHED=$(npm view "@omega3_0/nanoagent@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@omega3_0/nanoagent@${VERSION} is already published; continuing to GitHub Release."
          elif [ -n "$PUBLISHED" ]; then
            echo "Registry returned an unexpected version: $PUBLISHED" >&2
            exit 1
          else
            npm publish --access public
          fi

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip dpkg

      - name: Build Linux amd64 .deb + Windows x64 zip
        run: bun run package:native

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            dist-packages/*.deb
            dist-packages/*_win_x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
