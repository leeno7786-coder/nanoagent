name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BUN_VERSION: "1.3"
  NODE_VERSION: "24"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack

      - name: Publish (OIDC trusted publishing; skip if already published)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "@omega3_0/nanoagent@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "@omega3_0/nanoagent@${VERSION} is already published; continuing to GitHub Release."
          elif [ -n "$PUBLISHED" ]; then
            echo "Registry returned an unexpected version: $PUBLISHED" >&2
            exit 1
          else
            npm publish --access public
          fi

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip dpkg

      - name: Build Linux amd64 .deb + Windows x64 zip
        run: bun run package:native

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            dist-packages/*.deb
            dist-packages/*_win_x64.zip
          generate_release_notes: true
